name: Update Git Koi Profile

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: git-profile-koi
        uses: yalongwastaken/git-koi@v1.0.2
        with:
          GH_USERNAME: ${{ github.repository_owner }}
